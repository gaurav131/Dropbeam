name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing a source-only release because Apple signing credentials are not configured"
          fi
      - name: Build signed and notarized universal package
        if: steps.signing.outputs.available == 'true'
        run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: steps.signing.outputs.available == 'true'
        run: npm run test:package
      - if: steps.signing.outputs.available == 'true'
        run: npm run verify:release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING_CREDENTIALS: ${{ steps.signing.outputs.available }}
        run: |
          if [[ "$HAS_SIGNING_CREDENTIALS" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --generate-notes --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
              --notes "Source-only release. Signed and notarized macOS downloads will be attached after Apple signing credentials are configured."
          fi